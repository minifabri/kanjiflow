name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Le migrazioni SQLite corrispondono allo schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: Le migrazioni PostgreSQL corrispondono allo schema
        run: |
          npm run db:pg:schema
          git diff --exit-code prisma/postgres/schema.prisma
          DATABASE_PROVIDER=postgresql npx prisma migrate diff --from-migrations prisma/postgres/migrations --to-schema prisma/postgres/schema.prisma --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build
      # Senza --with-deps: le librerie di Chromium sono già nell'immagine del runner e l'app porta i propri font;
      # apt servirebbe solo per font di sistema aggiuntivi e rende il job dipendente dai mirror Ubuntu.
      - run: npx playwright install chromium
      - run: npm run test:e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
